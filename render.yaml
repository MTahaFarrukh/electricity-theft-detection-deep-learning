services:
  - type: web
    name: electricity-theft-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements-render.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
